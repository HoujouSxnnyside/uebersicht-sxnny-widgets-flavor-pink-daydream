name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install Just
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just@1.58.0

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package_version=$(bun -e "console.log(require('./package.json').version)")
          if [ "$tag" != "$package_version" ]; then
            echo "Version mismatch: git tag v$tag does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: just install

      - name: Run Unified Quality Gate
        run: just check

      - name: Package Übersicht distribution bundle
        run: just package

      - name: Compute SHA-256 Checksum
        run: |
          cd dist
          shasum -a 256 sxnny-pink-daydream.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/sxnny-pink-daydream.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
